<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workbook - Sesión C: Estrategia y Gestión</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@400;700;900&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="stylesheet" href="styles.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-blue': '#00529B',
                        'brand-orange': '#F68D2E',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 text-gray-800">

    <div class="flex flex-col md:flex-row min-h-screen">
        <aside class="w-full md:w-72 bg-white shadow-lg p-6 sticky top-0 h-screen overflow-y-auto flex flex-col z-10">
            <div class="flex items-center justify-center mb-6">
                <img src="logo.png" alt="Logo" class="h-20 object-contain">
            </div>

            <nav id="nav-menu" class="flex-1">
                <ul class="space-y-2">
                    </ul>
            </nav>

            <div class="mt-8 border-t pt-6">
                <button id="btn-download-pdf" class="w-full bg-brand-orange text-white font-bold py-3 px-4 rounded-lg shadow-md hover:bg-opacity-90 transition-all flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V7.414A2 2 0 0015.414 6L12 2.586A2 2 0 0011 2H6zm5 6a1 1 0 10-2 0v3.586l-1.293-1.293a1 1 0 10-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 11.586V8z" clip-rule="evenodd" />
                    </svg>
                    Descargar PDF Completo
                </button>
                <div id="loading" class="mt-4 text-center hidden">
                    <p class="text-brand-blue animate-pulse text-sm">Generando PDF...</p>
                </div>
            </div>
        </aside>

        <main class="flex-1 p-6 md:p-10 overflow-y-auto">
            <header class="bg-white shadow-md rounded-xl p-6 mb-8">
                <h1 class="text-4xl font-black brand-blue mb-2">Workbook de Estrategia</h1>
                <p class="text-lg text-gray-600 mt-2">Sesión C: Gasto Inteligente e Inversiones</p>
                
                <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Nombre del Participante:</label>
                        <input type="text" id="participant-name" class="autosave-input" placeholder="Tu nombre...">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Nombre de la Empresa:</label>
                        <input type="text" id="company-name" class="autosave-input" placeholder="Tu empresa...">
                    </div>
                </div>
            </header>

            <div id="dynamic-content" class="min-h-[500px]"></div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
